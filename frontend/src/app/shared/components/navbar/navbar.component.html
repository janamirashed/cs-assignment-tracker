<header class="top-navbar">
  <!-- logo -->
  <div class="navbar-left">
    <div class="logo-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <rect x="3" y="6" width="18" height="12" rx="2" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 10l3 2-3 2m5 0h3" />
      </svg>
    </div>
    <span class="logo-label">CS Tracker</span>
  </div>

  <!-- search -->
  <div class="search-bar">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="17" height="17">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input type="text" id="search-input" placeholder="Search assignments..." aria-label="Search assignments"
      (input)="onSearch($event)" />
  </div>

  <!-- right actions -->
  <div class="navbar-right">
    <button class="theme-toggle-btn" id="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'" [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <svg *ngIf="!isDarkMode" class="theme-icon moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <svg *ngIf="isDarkMode" class="theme-icon sun-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    </button>

    <button class="user-profile" id="user-profile-btn" (click)="openLogoutModal()" aria-label="User menu">
      <div class="user-info">
        <span class="user-name">{{ currentUser?.name }}</span>
        <span class="user-role">{{ currentUser?.role === 'ADMIN' ? 'CS Admin' : 'CS Student' }}</span>
      </div>
      <div class="avatar" id="user-avatar">
        <img *ngIf="currentUser?.pictureUrl" [src]="currentUser?.pictureUrl" alt="User avatar" referrerpolicy="no-referrer" />
        <span *ngIf="!currentUser?.pictureUrl">{{ (currentUser?.name || '?')[0] | uppercase }}</span>
      </div>
    </button>
  </div>

</header>

<!-- logout confirmation modal -->
<div class="modal-overlay" *ngIf="showLogoutModal" (click)="cancelLogout()">
  <div class="modal-card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
    aria-labelledby="modal-title">

    <!-- icon -->
    <div class="modal-icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="26" height="26">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </div>

    <h3 id="modal-title" class="modal-title">Log out?</h3>
    <p class="modal-body">Are you sure you want to log out?</p>

    <div class="modal-actions">
      <button class="btn-cancel" id="logout-cancel-btn" (click)="cancelLogout()">Cancel</button>
      <button class="btn-logout" id="logout-confirm-btn" (click)="confirmLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="15" height="15">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Log Out
      </button>
    </div>

  </div>
</div>
