<div class="dashboard-wrapper">

  <!-- navbar component -->
  <app-navbar (searchChange)="onSearchChange($event)"></app-navbar>

  <!-- page content -->
  <div class="page-content">

    <!-- left: task list -->
    <div class="tasks-column">
      <app-task-list
        [assignments]="filteredAssignments"
        [searchQuery]="searchQuery"
        [isAdmin]="isAdmin"
        (toggleComplete)="toggleAssignment($event)"
        (addAssignment)="openAddModal()"
        (editAssignment)="openEditModal($event)"
        (deleteAssignment)="deleteAssignment($event)">
      </app-task-list>
    </div>

    <!-- right: progress panel -->
    <aside class="progress-column" id="progress">
      <div class="section-header-sm">
        <h2>Progress Overview</h2>
      </div>
      <app-progress-chart
        [completedCount]="completedCount"
        [upcomingCount]="upcomingCount"
        [overdueCount]="overdueCount"
        [totalCount]="totalCount"
        [dueSoonCount]="dueSoonCount">
      </app-progress-chart>

    </aside>

  </div>
</div>

<!-- add/edit assignment modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card assignment-modal" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="modal-header">
      <h3 id="modal-title" class="modal-title">{{ isEditMode ? 'Edit Assignment' : 'Add New Assignment' }}</h3>
      <button class="modal-close" (click)="closeModal()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form class="modal-form" (ngSubmit)="saveAssignment()" #assignmentForm="ngForm">
      
      <!-- course name -->
      <div class="form-group full-width">
        <label for="courseName">Course Name <span class="required">*</span></label>
        <input type="text" id="courseName" name="courseName" [(ngModel)]="formData.courseName" required placeholder="e.g. ALGORITHMS">
      </div>

      <!-- title & due date -->
      <div class="form-group full-width">
        <label for="title">Assignment Title <span class="required">*</span></label>
        <input type="text" id="title" name="title" [(ngModel)]="formData.title" required placeholder="Enter assignment title">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="courseColor">Tag Color</label>
          <select id="courseColor" name="courseColor" [(ngModel)]="formData.courseColor">
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="green">Green</option>
            <option value="amber">Amber</option>
            <option value="rose">Rose</option>
            <option value="teal">Teal</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dueDate">Due Date <span class="required">*</span></label>
          <input type="text" id="dueDate" name="dueDate" [(ngModel)]="formData.dueDate" required placeholder="e.g. April 9th 23:59">
        </div>

      </div>

      <!-- submission & requirements -->
      <div class="form-row">
        <div class="form-group">
          <label for="submissionType">Submission Type</label>
          <select id="submissionType" name="submissionType" [(ngModel)]="formData.submissionType">
            <option value="form">Submit Form</option>
            <option value="teams">MS Teams</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="form-group">
          <label for="requirementUrl">Requirement URL</label>
          <input type="url" id="requirementUrl" name="requirementUrl" [(ngModel)]="formData.requirementUrl" placeholder="Google Drive/Doc link">
        </div>
      </div>
      
      <!-- submission url (if type is form or both) -->
      <div class="form-group full-width" *ngIf="formData.submissionType === 'form' || formData.submissionType === 'both'">
        <label for="submissionUrl">Submission Form URL</label>
        <input type="url" id="submissionUrl" name="submissionUrl" [(ngModel)]="formData.submissionUrl" placeholder="https://forms...">
      </div>

      <!-- optional admin comment -->
      <div class="form-group full-width">
        <label for="comment">Admin Comment (Optional)</label>
        <textarea id="comment" name="comment" [(ngModel)]="formData.comment" rows="2" placeholder="Any special notes for this assignment or graded feedback..."></textarea>
      </div>

      <!-- form actions -->
      <div class="modal-form-actions">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="!assignmentForm.valid">
          {{ isEditMode ? 'Save Changes' : 'Create Assignment' }}
        </button>
      </div>

    </form>
  </div>
</div>

<!-- delete confirmation modal -->
<div class="modal-overlay" *ngIf="showDeleteModal" (click)="cancelDelete()">
  <div class="modal-card assignment-modal" style="max-width: 400px;" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
    <div class="modal-header">
      <h3 id="delete-modal-title" class="modal-title" style="color: #ef4444;">Delete Assignment</h3>
      <button class="modal-close" (click)="cancelDelete()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div style="padding: 1.5rem 2rem;">
      <p style="margin-top: 0; margin-bottom: 0.5rem; color: #374151; font-weight: 500;">Are you sure you want to delete this assignment?</p>
      <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem; margin-top: 0;">This action cannot be undone and will permanently remove all student progress data for this assignment.</p>
      <div class="modal-form-actions" style="margin-top: 0;">
        <button type="button" class="btn-cancel" (click)="cancelDelete()">Cancel</button>
        <button type="button" class="btn-primary" style="background-color: #ef4444; border-color: #ef4444;" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- toast notification -->
<div class="toast-container" [class.show]="showToast" [class.error]="toastType === 'error'">
  <svg *ngIf="toastType === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
  </svg>
  <svg *ngIf="toastType === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <span>{{ toastMessage }}</span>
</div>
