<div class="progress-panel">

  <!-- donut chart -->
  <div class="donut-wrapper">
    <svg class="donut-svg" viewBox="0 0 120 120" aria-label="Progress donut chart">
      <!-- background track -->
      <circle cx="60" cy="60" r="48" fill="none" stroke="var(--border-color)" stroke-width="12"/>
      <!-- completed arc (green) -->
      <circle
        cx="60" cy="60" r="48" fill="none" stroke="#34d399" stroke-width="12"
        [attr.stroke-dasharray]="completedArc + ' ' + (CIRCUMFERENCE - completedArc)"
        stroke-dashoffset="0" stroke-linecap="round"
        transform="rotate(-90 60 60)"/>
      <!-- upcoming arc (purple) -->
      <circle
        cx="60" cy="60" r="48" fill="none" stroke="#a78bfa" stroke-width="12"
        [attr.stroke-dasharray]="upcomingArc + ' ' + (CIRCUMFERENCE - upcomingArc)"
        [attr.stroke-dashoffset]="'-' + completedArc"
        stroke-linecap="round" transform="rotate(-90 60 60)"/>
      <!-- overdue arc (rose/red) -->
      <circle
        cx="60" cy="60" r="48" fill="none" stroke="#fb7185" stroke-width="12"
        [attr.stroke-dasharray]="overdueArc + ' ' + (CIRCUMFERENCE - overdueArc)"
        [attr.stroke-dashoffset]="'-' + (completedArc + upcomingArc)"
        stroke-linecap="round" transform="rotate(-90 60 60)"/>
      <text x="60" y="55" text-anchor="middle" class="donut-pct">{{ percentage }}%</text>
      <text x="60" y="69" text-anchor="middle" class="donut-label">TOTAL DONE</text>
    </svg>
  </div>

  <!-- legend -->
  <div class="legend">
    <div class="legend-row">
      <span class="legend-dot green"></span>
      <span class="legend-name">Completed</span>
      <span class="legend-count green-text">{{ completedCount }}</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot purple"></span>
      <span class="legend-name">Upcoming</span>
      <span class="legend-count purple-text">{{ upcomingCount }}</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot rose"></span>
      <span class="legend-name">Overdue</span>
      <span class="legend-count rose-text">{{ overdueCount }}</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- stat pills -->
  <div class="stat-pills">
    <div class="stat-pill pill-amber">
      <span class="stat-label">UPCOMING</span>
      <span class="stat-value amber">{{ upcomingCount }}</span>
    </div>
    <div class="stat-pill pill-rose">
      <span class="stat-label">OVERDUE</span>
      <span class="stat-value rose">{{ overdueCount }}</span>
    </div>
    <div class="stat-pill pill-green">
      <span class="stat-label">COMPLETED</span>
      <span class="stat-value green">{{ completedCount }}</span>
    </div>
    <div class="stat-pill pill-blue">
      <span class="stat-label">TOTAL</span>
      <span class="stat-value blue">{{ totalCount }}</span>
    </div>
  </div>


</div>
