<div class="login-wrapper">


  <!-- login card -->
  <div class="login-card">
    <!-- logo -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <rect x="3" y="6" width="18" height="12" rx="2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 10l3 2-3 2m5 0h3"/>
        </svg>
      </div>
      <h2>CS Tracker</h2>
    </div>

    <!-- content -->
    <div class="card-content">
      <h1>Welcome Back</h1>
      <p class="subtitle">Track your progress and stay ahead with real-time insights.</p>

      <!-- error message -->
      <div *ngIf="errorMessage" class="error-banner" style="background: var(--rose-100); color: var(--rose-500); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: 500;">
        {{ errorMessage }}
      </div>

      <!-- google sign-in -->
      <button class="google-btn" id="login-google-btn" (click)="loginWithGoogle()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo" class="google-logo">
        Sign in with Google
      </button>

    </div>
  </div>

</div>
