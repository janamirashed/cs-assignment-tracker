<div class="login-wrapper">


  <!-- login card -->
  <div class="login-card">
    <!-- logo -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <rect x="3" y="6" width="18" height="12" rx="2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 10l3 2-3 2m5 0h3"/>
        </svg>
      </div>
      <h2>CS Tracker</h2>
    </div>

    <!-- content -->
    <div class="card-content">
      <h1>Welcome Back</h1>
      <p class="subtitle">Track your progress and stay ahead with real-time insights.</p>

      <!-- google sign-in -->
      <button class="google-btn" id="login-google-btn" (click)="loginWithGoogle()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo" class="google-logo">
        Sign in with Google
      </button>

      <!-- or divider -->
      <div class="divider-row">
        <span class="divider-line"></span>
        <span class="divider-label">OR</span>
        <span class="divider-line"></span>
      </div>

      <!-- secondary buttons -->
      <div class="secondary-btns">
        <button class="secondary-btn" id="login-email-btn">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          Email
        </button>

      </div>

      <!-- create account -->
      <p class="signup-row">
        New here? <a href="#" id="create-account-link" class="link">Create an account</a>
      </p>
    </div>
  </div>

</div>
